[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odylic-lens-api"
version = "0.1.0"
description = "Creative Analysis backend for Odylic Lens"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "requests>=2.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "Pillow>=10.0",
    # The Anthropic client is used by ad-tagging, comment analysis,
    # script analysis, and Deep Profile generation. These are core
    # features (not optional extras), so anthropic ships with every
    # install. Without it the AI Analysis tab returns
    # "No module named 'anthropic'" the moment the user adds a key.
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
sentiment = ["transformers>=4.40", "torch>=2.2"]
# Local audio transcription. Install with:
#   pip install -e '.[transcribe]'
# mlx-whisper is Apple Silicon only — pip will skip it on other
# platforms and faster-whisper becomes the active engine.
transcribe = [
    "mlx-whisper>=0.4; platform_system=='Darwin' and platform_machine=='arm64'",
    "faster-whisper>=1.0",
    "torch>=2.2",
    "torchaudio>=2.2",
    "silero-vad>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = [
    "main",
    "auth",
    "store",
    "meta_client",
    "ad_analysis_endpoints",
    "creative_warehouse",
    "lens_context",
    "lens_routes",
    "security",
    "integrations",
    "test_mock",
    "transcription",
]

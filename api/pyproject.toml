[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odylic-lens-api"
version = "0.3.0"
description = "Creative Analysis backend for Odylic Lens"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "requests>=2.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "Pillow>=10.0",
    # The Anthropic client is used by ad-tagging, comment analysis,
    # script analysis, and Deep Profile generation. These are core
    # features (not optional extras), so anthropic ships with every
    # install. Without it the AI Analysis tab returns
    # "No module named 'anthropic'" the moment the user adds a key.
    "anthropic>=0.40",
    # vaderSentiment is the lightweight fallback for comment sentiment
    # scoring when the heavier RoBERTa/transformers extras aren't
    # installed. ~100KB, no native deps. Without it the Comments tab
    # ships with no sentiment labels at all because the fallback
    # branch ImportErrors before it can score anything.
    "vaderSentiment>=3.3",
    # ffmpeg-python wraps the ffmpeg binary for video frame extraction
    # in the Analyze stage (Layer 1 video reading: extract 8-12 frames
    # per winner, feed to Claude vision alongside transcript). The CLI
    # binary itself must also be on PATH (`brew install ffmpeg`).
    "ffmpeg-python>=0.2.0",
    # fal-client is the official SDK for fal.ai, used by the Create
    # stage for video generation (Kling/Veo/Hunyuan). Image gen routes
    # through ChatGPT Pro subscription manually (see plan §Create).
    "fal-client>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
sentiment = ["transformers>=4.40", "torch>=2.2"]
# Local audio transcription. Install with:
#   pip install -e '.[transcribe]'
# mlx-whisper is Apple Silicon only — pip will skip it on other
# platforms and faster-whisper becomes the active engine.
transcribe = [
    "mlx-whisper>=0.4; platform_system=='Darwin' and platform_machine=='arm64'",
    "faster-whisper>=1.0",
    "torch>=2.2",
    "torchaudio>=2.2",
    "silero-vad>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = [
    "main",
    "ads_reports_endpoints",
    "analyze_endpoints",
    "atria_endpoints",
    "auth",
    "boards_endpoints",
    "brand_profile_store",
    "store",
    "meta_client",
    "ad_analysis_endpoints",
    "claude_client",
    "creative_warehouse",
    "frame_extractor",
    "lens_context",
    "lens_routes",
    "security",
    "integrations",
    "test_mock",
    "transcription",
]
